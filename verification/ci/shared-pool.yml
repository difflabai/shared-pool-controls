          - { mutant: "32", gb: 25, timeout: 3360 }
          - { mutant: "33", gb: 25, timeout: 3360 }
          - { mutant: "35", gb: 18, timeout: 7200 }
          - { mutant: "36", gb: 21, timeout: 7200 }
          - { mutant: "37", gb: 37, timeout: 2580 }
          - { mutant: "40", gb: 21, timeout: 3060 }
          - { mutant: "41", gb: 16, timeout: 7200 }
          - { mutant: "42", gb: 21, timeout: 7200 }
          - { mutant: "44", gb: 21, timeout: 7200 }
          - { mutant: "45", gb: 30, timeout: 6000 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
