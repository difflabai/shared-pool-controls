        # kani-record; raising one is fine). These are the local record's
        # harnesses (check-kani-record.py), and kani/local/run-local.py
        # --record runs them, with these timeouts, from this list. Measured
        # locally: 48 of the 48; not yet (sized from estimates; the record
        # needs a run of each): none.
        include:
          - { group: "h_init h_validate h_energy", gb: 37, timeout: 2580 }
          - { group: "h_energy_exact h_energy_max h_preview", gb: 33, timeout: 6000 }
          - { group: "h_preview_post h_live_all", gb: 24, timeout: 7200 }
          - { group: "h_wedge_healthy h_bmc_from_init_po h_slot_cycle_0", gb: 38, timeout: 6120 }
          - { group: "h_slot_cycle_2 h_full_255 h_full_256", gb: 40, timeout: 4500 }
          - { group: "h_full_256_prune h_version_cap_submit", gb: 21, timeout: 7200 }
          - { group: "h_version_cap_settle h_wf_submit", gb: 21, timeout: 7200 }
          - { group: "h_wf_settle h_bmc_from_init_s_submit", gb: 40, timeout: 7200 }
          - { group: "h_bmc_from_init_s_dispatch h_bmc_from_init_s_ack h_bmc_from_init_s_cancel h_bmc_from_init_s_settle h_bmc_from_init_s_pause h_bmc_from_init_s_observe h_step_submit_tx", gb: 22, timeout: 2340 }
          - { group: "h_step_submit_post h_step_submit_inv h_step_submit_cov h_step_cancel_post h_step_cancel_inv", gb: 25, timeout: 3360 }
          - { group: "h_step_cancel_cov h_step_settle_tx h_step_settle_post h_step_settle_inv h_step_settle_cov h_step_observe_post", gb: 21, timeout: 3060 }
          - { group: "h_step_submit_inv_0 h_step_submit_inv_1", gb: 26, timeout: 2160 }
          - { group: "h_step_submit_inv_3 h_step_dispatch_inv_3", gb: 27, timeout: 7200 }
          - { group: "h_step_cancel_inv_3 h_step_settle_inv_1", gb: 21, timeout: 7200 }
          - { group: "h_step_settle_inv_3 h_ref_submit", gb: 23, timeout: 8460 }
          - { group: "h_ref_settle", gb: 15, timeout: 1800 }
          - { group: "h_wedge", gb: 32, timeout: 2220 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check out shared-pool-controls at the pin
        run: tools/scripts/ci-submodule.sh projects/shared-pool/source-mirror
      - name: Install Kani (and the CBMC it bundles)
        run: |
          . tools/versions.env
          cargo install --locked kani-verifier --version "$KANI"
          # `cargo kani setup` always re-downloads the bundle; on a persistent
          # self-hosted HOME skip it once the bundle and its toolchain link
          # (setup's last step) are in place.
          kani_dir="${KANI_HOME:-$HOME/.kani}/kani-$KANI"
          if [ ! -x "$kani_dir/bin/cbmc" ] || [ ! -d "$kani_dir/toolchain/bin" ]; then
            cargo kani setup
          fi
      - name: Check CBMC version
        run: |
          . tools/versions.env
          # The pinned version's own CBMC: a persistent HOME may hold others.
          cbmc_bin="${KANI_HOME:-$HOME/.kani}/kani-$KANI/bin/cbmc"
          "$cbmc_bin" --version | grep -q "^$CBMC" || { echo "CBMC is not $CBMC"; "$cbmc_bin" --version; exit 1; }
      - name: Runner size against the measured peak
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            ram=$(( $(sysctl -n hw.memsize) / 1073741824 )); swap=
          else
            ram=$(( $(awk '/^MemTotal:/{print $2}' /proc/meminfo) / 1048576 ))
            swap=$(( $(awk '/^SwapTotal:/{print $2}' /proc/meminfo) / 1048576 ))
          fi
          echo "::notice::runner has $(getconf _NPROCESSORS_ONLN) CPUs, $ram GB memory, ${swap:-dynamic} GB swap; this job's harnesses peaked at $GB GB (the matrix gb, from the local measurement)"
          if [ "$ram" -lt "$GB" ]; then
            # The large entries do not run on a hosted runner's swap: there
            # they failed or crawled (CI runs 43469880167, 43488691444).
            if [ "$RUNNER_KIND" = github-hosted ]; then
              echo "::error::this job's harnesses peaked at $GB GB and this hosted runner has $ram GB of memory: set KANI_RUNNER to a runner with at least $(( (GB * 5 + 3) / 4 )) GB, or unset it so that kani-record checks the local record (strategy.md section 14)"
              exit 1
            fi
            if [ -n "$swap" ] && [ $(( ram + swap )) -lt "$GB" ]; then
              echo "::error::this job's harnesses peaked at $GB GB and the runner has $ram GB of memory and $swap GB of swap: set KANI_RUNNER to a runner with at least $(( (GB * 5 + 3) / 4 )) GB (strategy.md section 14)"
              exit 1
            fi
            echo "::warning::this job's harnesses peaked at $GB GB, above the runner's $ram GB: they run on swap, up to 4 times slower than measured or out of time (CI run 43469880167); KANI_RUNNER names a larger runner (strategy.md section 14)"
          fi
      - name: Kani ${{ matrix.group }}
        env:
          GROUP: ${{ matrix.group }}
          KANI_TIMEOUT: ${{ matrix.timeout }}
          KANI_LOG_DIR: ${{ runner.temp }}/kani-logs
          KANI_DEFER_COVERS: "1"
        run: |
          # 1.5 times the group's measured peak (see above `plain:`).
          export KANI_MAX_GB=$(( (GB * 3 + 1) / 2 ))
          # run.sh reads each harness's loop ids with this CBMC (by default
          # the last ~/.kani/kani-*; a persistent HOME may hold others). Not
          # by sourcing versions.env: run.sh reads KANI as the Kani command.
          v=$(sed -n 's/^KANI=//p' tools/versions.env)
          export KANI_CBMC="${KANI_HOME:-$HOME/.kani}/kani-$v/bin/cbmc"
          # GROUP: harness names separated by spaces.
          read -ra harnesses <<<"$GROUP"
          if [ -r /proc/meminfo ]; then
            ram=$(( $(awk '/^MemTotal:/{print $2}' /proc/meminfo) / 1048576 ))
            # On swap (memory below the group's peak: a KANI_RUNNER or
            # CI_RUNNER smaller than the group, with swap of its own) the
            # measured times do not hold: in CI run 43469880167 harnesses
